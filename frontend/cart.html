<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Brew & Bean Café</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a><a href="/#offers">Offers</a><a href="/tracking.html">Track Order</a></div>
  <div class="nav-icons"><a href="#" class="nav-user-slot"></a><a href="/cart.html" style="color:var(--caramel);">🛒<span class="badge-dot cart-badge">0</span></a>
  <button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a></div></nav>

<header class="page-header"><div class="container"><h1>Your Cart</h1><p>Review your order before checkout.</p></div></header>

<main class="container" style="padding:50px 0 80px;">
  <div id="cartRoot" style="display:grid;grid-template-columns:1.6fr 1fr;gap:40px;align-items:start;">
    <p class="muted">Loading…</p>
  </div>
</main>

<footer><div class="container"><div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div></div></footer>

<script src="js/common.js"></script>
<script>
let productMap = {};

async function loadCart() {
  const root = document.getElementById('cartRoot');
  const items = Cart.read();
  if (items.length === 0) {
    root.innerHTML = `<div><p class="muted">Your cart is empty. <a href="/menu.html" style="text-decoration:underline;">Browse the menu →</a></p></div><div></div>`;
    return;
  }
  try {
    const results = await Promise.all(items.map((i) => api('/products/' + i.productId).then((r) => r.product).catch(() => null)));
    results.forEach((p) => { if (p) productMap[p._id] = p; });
    renderRows(items, results);
  } catch (err) {
      root.textContent = err.message;
  }
}

function renderRows(items, results) {
  let subtotal = 0;
  const rows = items.map((item, idx) => {
    const p = results[idx];
    if (!p) return '';
    const lineTotal = p.price * item.qty;
    subtotal += lineTotal;
    return `
      <div class="cart-row">
        <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}">
        <div><strong>${escapeHTML(p.name)}</strong><div class="muted" style="font-size:13px;">${rupees(p.price)} each</div></div>
        <div class="qty-control">
          <button data-dec="${escapeHTML(p._id)}">−</button><span>${escapeHTML(item.qty)}</span><button data-inc="${escapeHTML(p._id)}">+</button>
        </div>
        <div>${rupees(lineTotal)}</div>
        <button class="remove-link" data-remove="${escapeHTML(p._id)}">Remove</button>
      </div>`;
  }).join('');

  const deliveryFee = 40, gst = Math.round(subtotal * 0.05), total = subtotal + deliveryFee + gst;

  document.getElementById('cartRoot').innerHTML = `
    <div>${rows}</div>
    <div class="summary-card">
      <h3 style="margin-bottom:16px;">Order Summary</h3>
      <div class="summary-line"><span>Subtotal</span><span>${rupees(subtotal)}</span></div>
      <div class="summary-line"><span>Delivery</span><span>${rupees(deliveryFee)}</span></div>
      <div class="summary-line"><span>Discount</span><span>−₹0</span></div>
      <div class="summary-line"><span>GST (5%)</span><span>${rupees(gst)}</span></div>
      <div class="summary-line total"><span>Total</span><span>${rupees(total)}</span></div>
      <a href="/checkout.html" class="btn full gold" style="margin-top:18px;">Proceed to Checkout</a>
      <p class="muted" style="font-size:12px;margin-top:10px;">Final delivery fee, discount and GST are recalculated at checkout.</p>
    </div>`;

  document.querySelectorAll('[data-inc]').forEach((b) => b.onclick = () => { Cart.setQty(b.dataset.inc, (Cart.read().find(i=>i.productId===b.dataset.inc)?.qty||0)+1); loadCart(); });
  document.querySelectorAll('[data-dec]').forEach((b) => b.onclick = () => { const cur = Cart.read().find(i=>i.productId===b.dataset.dec)?.qty||0; Cart.setQty(b.dataset.dec, cur-1); loadCart(); });
  document.querySelectorAll('[data-remove]').forEach((b) => b.onclick = () => { Cart.remove(b.dataset.remove); loadCart(); });
}

loadCart();
</script>
</body>
</html>
