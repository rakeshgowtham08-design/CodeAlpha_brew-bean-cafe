<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Brew & Bean Café</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a></div>
  <div class="nav-icons"><a href="/cart.html">🛒<span class="badge-dot cart-badge">0</span></a><button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a><a href="/menu.html">Menu</a></div></nav>

<main class="container" style="max-width:460px;padding:160px 28px 100px;">
  <h1 style="font-size:28px;">Forgot your password?</h1>
  <p class="muted" style="margin-top:8px;">Enter the email address for your account and we’ll send a one-time reset link.</p>
  <div id="alertBox" style="margin-top:20px;"></div>
  <form id="forgotForm" style="margin-top:20px;">
    <div class="field"><label for="resetEmail">Email</label><input type="email" id="resetEmail" autocomplete="email" required></div>
    <button class="btn full" type="submit">Send reset link</button>
  </form>
  <p class="center muted mt" style="font-size:14px;"><a href="/login.html" style="color:var(--caramel);font-weight:600;">Back to log in</a></p>
</main>

<footer><div class="container"><div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div></div></footer>
<script src="/js/common.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const box = document.getElementById('alertBox');
  const button = event.currentTarget.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    const result = await api('/auth/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('resetEmail').value }),
    });
    box.textContent = result.message;
    box.className = 'alert ok';
  } catch (error) {
    box.textContent = error.message;
    box.className = 'alert error';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
