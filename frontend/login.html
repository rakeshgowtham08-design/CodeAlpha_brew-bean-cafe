<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Brew & Bean Café</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a></div>
  <div class="nav-icons"><a href="/cart.html">🛒<span class="badge-dot cart-badge">0</span></a><button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a><a href="/menu.html">Menu</a></div></nav>

<main class="container" style="max-width:420px;padding:160px 28px 100px;">
  <div id="formTitle"><h1 style="font-size:28px;">Log in</h1><p class="muted" style="margin-top:6px;">Welcome back to Brew & Bean.</p></div>
  <div id="alertBox" style="margin-top:20px;"></div>

  <form id="loginForm">
    <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" autocomplete="email" required></div>
    <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
    <p class="center muted mt" style="font-size:14px;">
      <a href="/forgot-password.html" style="color:var(--caramel);font-weight:600;">
        Forgot Password?
      </a>
    </p>
    <button class="btn full" type="submit">Log in</button>
  </form>

  <form id="registerForm" style="display:none;">
    <div class="field"><label>Name</label><input type="text" id="regName" required></div>
    <div class="field"><label>Email</label><input type="email" id="regEmail" required></div>
    <div class="field"><label>Phone</label><input type="tel" id="regPhone"></div>
    <div class="field"><label>Password</label><input type="password" id="regPassword" minlength="8" maxlength="128" autocomplete="new-password" required></div>
    <button class="btn full" type="submit">Create account</button>
  </form>

  <p class="center muted mt" style="font-size:14px;">
    <span id="switchPrompt">No account?</span>
    <a href="#" id="switchLink" style="color:var(--caramel);font-weight:600;">Register</a>
  </p>
</main>

<footer><div class="container"><div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div></div></footer>

<script src="/js/common.js"></script>
<script>
let mode = 'login';
function syncMode() {
  document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('formTitle').innerHTML = mode === 'login'
    ? '<h1 style="font-size:28px;">Log in</h1><p class="muted" style="margin-top:6px;">Welcome back to Brew & Bean.</p>'
    : '<h1 style="font-size:28px;">Create an account</h1><p class="muted" style="margin-top:6px;">Takes less time than your coffee brews.</p>';
  document.getElementById('switchPrompt').textContent = mode === 'login' ? 'No account?' : 'Already have an account?';
  document.getElementById('switchLink').textContent = mode === 'login' ? 'Register' : 'Log in';
  document.getElementById('alertBox').innerHTML = '';
}
document.getElementById('switchLink').addEventListener('click', (e) => { e.preventDefault(); mode = mode === 'login' ? 'register' : 'login'; syncMode(); });

function afterAuth(data) {
  setSession(data.token, data.user);
  const next = new URLSearchParams(location.search).get('next') || '/';
  window.location.href = next;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alertBox');
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('loginEmail').value, password: document.getElementById('loginPassword').value,
    }) });
    afterAuth(data);
  } catch (err) { box.textContent = err.message; box.className = 'alert error'; }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alertBox');
  try {
    const data = await api('/auth/register', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      password: document.getElementById('regPassword').value,
    }) });
    afterAuth(data);
  } catch (err) { box.textContent = err.message; box.className = 'alert error'; }
});

syncMode();
</script>
</body>
</html>
