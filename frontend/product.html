<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Brew & Bean Café</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a><a href="/#offers">Offers</a><a href="/tracking.html">Track Order</a></div>
  <div class="nav-icons"><a href="#" class="nav-user-slot"></a><a href="/cart.html">🛒<span class="badge-dot cart-badge">0</span></a>
  <button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a><a href="/cart.html">Cart</a></div></nav>

<main class="container" style="padding-top:140px;padding-bottom:80px;">
  <div id="root"><p class="muted">Loading…</p></div>
</main>

<footer><div class="container">
  <div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div>
</div></footer>

<script src="/js/common.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
async function load() {
  const root = document.getElementById('root');
  if (!id) { root.innerHTML = '<p>No product specified.</p>'; return; }
  try {
     const { product: p } = await api('/products/' + encodeURIComponent(id));
    const badgeLabel = { bestseller: '🔥 BESTSELLER', favorite: '⭐ FAVORITE', new: '✨ NEW' }[p.badge] || '';
    root.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start;">
        <div style="position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);">
          <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;">
          ${badgeLabel ? `<span class="product-badge ${p.badge}" style="top:16px;left:16px;">${badgeLabel}</span>` : ''}
        </div>
        <div>
          <div class="cat-tag" style="margin-bottom:10px;"><span class="veg-dot ${p.isVeg ? '' : 'non'}"></span>${escapeHTML(p.category)}</div>
          <h1 class="display" style="font-size:32px;">${escapeHTML(p.name)}</h1>
          <div class="rating" style="margin:10px 0;">★ ${Number(p.rating).toFixed(1)} rating</div>
          <div class="price-tag" style="font-size:26px;">${rupees(p.price)}</div>
          <p class="muted" style="margin:18px 0 26px;max-width:50ch;">${escapeHTML(p.description)}</p>
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;">
            <div class="qty-control"><button id="qdec">−</button><span id="qval">1</span><button id="qinc">+</button></div>
            <button class="btn" id="addBtn">Add to Cart</button>
            <button class="wishlist-btn" id="wishBtn" style="position:static;">♡</button>
          </div>
          <div class="muted" style="font-size:13px;">${Number(p.stock)} in stock</div>
          <div id="feedback"></div>
        </div>
      </div>`;
    let qty = 1;
    document.getElementById('qdec').onclick = () => { qty = Math.max(1, qty - 1); document.getElementById('qval').textContent = qty; };
    document.getElementById('qinc').onclick = () => { qty = Math.min(p.stock, qty + 1); document.getElementById('qval').textContent = qty; };
    document.getElementById('addBtn').onclick = () => {
      Cart.add(p._id, qty);
      document.getElementById('feedback').innerHTML = `<p style="color:var(--ok);margin-top:14px;">Added ${qty} to your cart. <a href="/cart.html" style="text-decoration:underline;">View cart →</a></p>`;
    };
    document.getElementById('wishBtn').onclick = (e) => { e.target.classList.toggle('active'); e.target.textContent = e.target.classList.contains('active') ? '♥' : '♡'; };
  } catch (err) {
     root.textContent = err.message;
  }
}
load();
</script>
</body>
</html>
