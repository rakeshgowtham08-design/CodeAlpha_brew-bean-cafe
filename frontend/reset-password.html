<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Brew & Bean Café</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a></div>
  <div class="nav-icons"><a href="/cart.html">🛒<span class="badge-dot cart-badge">0</span></a><button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a><a href="/menu.html">Menu</a></div></nav>

<main class="container" style="max-width:460px;padding:160px 28px 100px;">
  <h1 style="font-size:28px;">Choose a new password</h1>
  <p class="muted" style="margin-top:8px;">Reset links can only be used once and expire after one hour.</p>
  <div id="alertBox" style="margin-top:20px;"></div>
  <form id="resetForm" style="margin-top:20px;">
    <div class="field"><label for="newPassword">New password</label><input type="password" id="newPassword" autocomplete="new-password" minlength="6" required></div>
    <div class="field"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required></div>
    <button class="btn full" type="submit">Reset password</button>
  </form>
  <p class="center muted mt" style="font-size:14px;"><a href="/login.html" style="color:var(--caramel);font-weight:600;">Back to log in</a></p>
</main>

<footer><div class="container"><div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div></div></footer>
<script src="/js/common.js"></script>
<script>
const resetToken = new URLSearchParams(location.search).get('token');
const resetForm = document.getElementById('resetForm');
const alertBox = document.getElementById('alertBox');
if (!resetToken) {
  resetForm.hidden = true;
  alertBox.innerHTML = '<div class="alert error">This reset link is missing its token. Request a new password reset link.</div>';
}
resetForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirmation = document.getElementById('confirmPassword').value;
  if (password !== confirmation) {
    alertBox.textContent = 'The passwords do not match.';
    alertBox.className = 'alert error';
    return;
  }
  const button = resetForm.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    const result = await api('/auth/reset-password', {
      method: 'POST',
      body: JSON.stringify({ token: resetToken, password }),
    });
    alertBox.textContent = result.message;
    alertBox.className = 'alert ok';
    resetForm.hidden = true;
  } catch (error) {
    alertBox.textContent = error.message;
    alertBox.className = 'alert error';
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
