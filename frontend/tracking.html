<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Brew & Bean Café</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav scrolled"><div class="nav-inner">
  <a href="/" class="logo">☕ BREW & BEAN</a>
  <div class="nav-links"><a href="/">Home</a><a href="/menu.html">Menu</a><a href="/about.html">About</a></div>
  <div class="nav-icons"><a href="#" class="nav-user-slot"></a><a href="/cart.html">🛒<span class="badge-dot cart-badge">0</span></a>
  <button class="hamburger" id="hamburgerBtn">☰</button></div>
</div><div id="mobileMenu"><a href="/">Home</a></div></nav>

<header class="page-header"><div class="container"><h1>Track Your Order</h1><p>Follow your order from kitchen to doorstep.</p></div></header>

<main class="container" style="padding:50px 0 90px;">
  <div id="root"><p class="muted">Loading…</p></div>
</main>

<footer><div class="container"><div class="footer-bottom">© 2026 Brew & Bean Café. All rights reserved.</div></div></footer>

<script src="/js/common.js"></script>
<script>
const STEP_LABELS = { confirmed: ['✓', 'Order Confirmed'], preparing: ['☕', 'Preparing'], ready: ['📦', 'Ready'], out_for_delivery: ['🛵', 'Out for Delivery'], delivered: ['✓', 'Delivered'] };

async function init() {
  const user = getUser();
  const root = document.getElementById('root');
  if (!user) { window.location.href = '/login.html?next=/tracking.html'; return; }

  const id = new URLSearchParams(location.search).get('id');
  if (id) { renderOne(id); return; }

  try {
    const { orders } = await api('/orders/mine');
    if (orders.length === 0) { root.innerHTML = `<p class="muted">No orders yet. <a href="/menu.html" style="text-decoration:underline;">Start an order →</a></p>`; return; }
    root.innerHTML = orders.map((o) => `
      <div class="order-card" style="cursor:pointer;" data-order-id="${escapeHTML(o._id)}" role="button" tabindex="0">
        <div style="display:flex;justify-content:space-between;">
          <strong>Order #${escapeHTML(o._id.slice(-6).toUpperCase())}</strong><span class="muted">${escapeHTML(new Date(o.createdAt).toLocaleString())}</span>
        </div>
        <div class="muted" style="margin-top:6px;">${escapeHTML(STEP_LABELS[o.status]?.[1] || 'Status unavailable')} · ${rupees(o.total)}</div>
      </div>`).join('');
    root.querySelectorAll('[data-order-id]').forEach((card) => {
      card.addEventListener('click', () => renderOne(card.dataset.orderId));
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); renderOne(card.dataset.orderId); }
      });
    });
  } catch (err) { root.textContent = err.message; }
}

async function renderOne(id) {
  const root = document.getElementById('root');
  root.innerHTML = `<p class="muted">Loading order…</p>`;
  try {
    const { order, steps } = await api('/orders/' + id);
    const currentIdx = steps.indexOf(order.status);
    root.innerHTML = `
      <div class="order-card" style="padding:30px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
          <h3>Order #${escapeHTML(order._id.slice(-6).toUpperCase())}</h3><strong>${rupees(order.total)}</strong>
        </div>
        <div class="track-timeline">
          ${steps.map((s, i) => `
            <div class="track-step ${i < currentIdx ? 'done' : i === currentIdx ? 'current' : ''}">
              <div class="dot">${escapeHTML(STEP_LABELS[s]?.[0] || '•')}</div><span class="label">${escapeHTML(STEP_LABELS[s]?.[1] || 'Status unavailable')}</span>
            </div>`).join('')}
        </div>
        <div class="mt">
          ${order.items.map((i) => `<div class="order-line"><span>${escapeHTML(i.name)} × ${Number(i.quantity)}</span><span>${rupees(i.price*i.quantity)}</span></div>`).join('')}
        </div>
      </div>
      <a href="/tracking.html" class="btn outline-dark mt" style="display:inline-block;">← All orders</a>`;
  } catch (err) { root.textContent = err.message; }
}

init();
</script>
</body>
</html>
